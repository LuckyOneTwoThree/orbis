[package]
name = "orbis"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license.workspace = true
repository.workspace = true
description = "Orbis 桌面壳：命令注册、生命周期与事件桥（唯一组装根）"
publish = false

# Tauri 2 模板约定：lib 独立命名，避免 Windows 下 bin/lib 同名冲突
[lib]
name = "orbis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 唯一允许依赖全部 crate 的组装根（pm/04 §4.1）。
# 4 个领域 crate 全部链接进来：任何一次构建都会顺带验证它们能在目标平台编译
# （CI 的同名 job 做回归防线）。命令面见 src/commands.rs。
orbis-core = { workspace = true }
orbis-platform = { workspace = true }
orbis-providers = { workspace = true }
orbis-tools = { workspace = true }

tauri = { version = "2", features = [] }
# 单实例互斥：第二实例只前置已有窗口后退出（pm/04 §5.12）
tauri-plugin-single-instance = "2"

# 契约错误体与 DTO 的序列化（docs/ipc-contract.md §1 命名口径）。
# 版本串与其它 crate 保持一致 —— requirement 相同就不会改动 Cargo.lock 的解析结果。
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[features]
# Tauri 默认特性集（保持与模板一致，便于后续 `tauri add` 插件）
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

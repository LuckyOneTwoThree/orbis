# Orbis Cargo Workspace
#
# 依赖方向是**架构不变量**（pm/00-产品基石.md §12.3 规则 1、§12.4 B 组），
# 由 workspace 成员声明 + CI 断言共同保证（pm/04-技术设计.md §9.1）：
#
#     providers → core, platform
#     tools     → core, platform
#     platform  → core
#     core      → （无内部依赖，零游戏知识）
#
# 新增游戏或新增工具**不得**修改 core；core 中出现任何游戏 slug 视为不变量破坏。
#
# 注意：src-tauri/ 已作为成员接入（曾计划由 `cargo tauri init` 生成后再加入，
# 现已手写最小壳并接入 —— 因为「能产出 Windows 安装包」是当前阶段的硬目标，
# 而壳是打包的前置条件。壳内不含业务逻辑，只做命令注册 / 生命周期 / 事件桥）。

[workspace]
resolver = "2"
members = [
  "crates/orbis-core",
  "crates/orbis-platform",
  "crates/orbis-providers",
  "crates/orbis-tools",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "GPL-3.0-or-later"
repository = "https://github.com/<owner>/orbis"
description = "跨厂商二次元 PC 游戏中心（Game Control Center）"

[workspace.dependencies]
# ── 内部 crate ────────────────────────────────────────────
orbis-core = { path = "crates/orbis-core" }
orbis-platform = { path = "crates/orbis-platform" }
orbis-providers = { path = "crates/orbis-providers" }
orbis-tools = { path = "crates/orbis-tools" }

# ── 外部依赖（按 pm/04-技术设计.md §2.1 选型总表）──────────
#
# 2026-09-20 起 Windows 开发机已具备 Rust 工具链（rustc 1.98.1 / stable-msvc），
# 因此外部依赖一律由 `cargo add` 解析真实版本并锁定，不再手写猜测的版本号。
#
# 引入纪律：用到时才加，避免"空依赖"（crate 里没人用却出现在 dependencies 里）。
# 每加一个都要确认它与 `deny.toml` 的 License 白名单相容（04 §2.2）。
#
# 计划引入（用到时再加，避免空依赖）：
#   rusqlite      （bundled）           SQLite：orbis-platform
#   sysinfo                            进程快照：orbis-platform
#   winreg                            注册表发现：orbis-platform（#[cfg(windows)]）
#   reqwest      （rustls）            只读版本探测：orbis-platform
#   sha2                               备份完整性 / 资产校验：orbis-platform
#   tracing + tracing-subscriber       JSONL 日志：orbis-platform
#   thiserror                          crate 内错误：orbis-core
#   anyhow                             应用层错误：src-tauri
#   serde + serde_json                 seed.json / Manifest 反序列化：orbis-core
#   tokio                              Tauri 异步运行时：src-tauri
#   tauri 2.x + tauri-specta           IPC 与 TS 绑定生成：src-tauri
#   tauri-plugin-single-instance       单实例互斥（04 §5.12）

[profile.release]
# 打包体积与启动性能优先（02 §5：冷启动 ≤ 3s，常驻内存目标 < 150MB）
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
# 刻意**不设** panic = "abort"：pm/04-技术设计.md §5.5 要求执行器用 catch_unwind
# 把工具链路的 panic 转为 RollingBack，从而保证「Tool 失败不影响 Launcher」
# （00 §12.3 规则 9 / §12.4 A 组）。abort 会让 catch_unwind 失效并直接终止进程。

<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbis</title>
    <!--
      字体全部自托管（见 src/main.tsx 的 @fontsource 导入），此文件刻意不引用任何远程资源。
      原因：NFR 要求「除版本比对数据源外全部功能离线可用」（pm/02 §5）。原先从
      fonts.googleapis.com 加载 —— 离线启动时 Material Symbols 的字形加载失败，
      图标会退化成图标名文字（如 "play_arrow"），界面直接不可用。
      同时这也让 Tauri 的 CSP 可以保持严格（无外部来源）。
    -->
  </head>
  <body class="bg-bg-base text-on-surface font-body-md select-none antialiased min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
